<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f19">
<title>OmniRoute-Rust — AI Gateway Dashboard</title>
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<link rel="icon" href="/dashboard/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="sb-head"><span class="logo">◈</span>&nbsp;omniroute<span class="accent">-rust</span><span id="sidebar-ver" class="ver">v</span></div>
    <nav id="sidebar-nav"></nav>
  </aside>
  <div id="main">
    <header id="topbar">
      <button id="sidebar-toggle" class="mini"><span class="material-symbols-outlined">menu</span></button>
      <span id="paged-sub" class="muted small">omniroute-rust gateway</span>
      <span class="spacer"></span>
      <span id="health-dot" class="dot"></span><span id="health-text" class="muted small">checking…</span>
      <div id="lang-selector" style="display:none;padding:2px 8px;border:1px solid var(--border);border-radius:6px;cursor:pointer">
        <span id="lang-flag">🇺🇸</span> <b id="lang-label">English</b>
      </div>
      <button id="logout" class="mini hidden"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">logout</span> log out</button>
    </header>
    <div id="default-pw-banner">⚠ Default admin password <b>CHANGEME</b> is active —
      <input type="password" id="new-pw" placeholder="new password (min 8)" style="width:190px;margin:0 8px">
      <button id="pw-change" class="mini">change now</button>
      <span id="pw-msg"></span>
    </div>
    <main id="page"></main>
    <footer>omniroute-rust · <a href="https://github.com/diegosouzapw/OmniRoute" target="_blank">upstream project</a> · PWA</footer>
  </div>
</div>
<div id="login-screen" style="display:none">
  <div class="login-card">
    <h2>omniroute-rust</h2>
    <p class="muted small">dashboard login (default: <b>CHANGEME</b>)</p>
    <input type="password" id="login-password" placeholder="admin password" autocomplete="current-password">
    <button class="save" id="login-btn">Log in</button>
    <p id="login-error" class="s-err"></p>
  </div>
</div>
<div id="modal" style="display:none"><div id="modal-card" class="card"></div></div>
<div id="toast"></div>
<script src="/dashboard/app.js"></script>
</body>
</html>
