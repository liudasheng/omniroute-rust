<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>OmniRoute — AI Gateway for Multi-Provider LLMs</title>
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<link rel="icon" href="/dashboard/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="logo-box"><svg width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="3" fill="currentColor"/>
        <circle cx="8" cy="8" r="2" fill="currentColor"/>
        <circle cx="24" cy="8" r="2" fill="currentColor"/>
        <circle cx="8" cy="24" r="2" fill="currentColor"/>
        <circle cx="24" cy="24" r="2" fill="currentColor"/>
        <circle cx="16" cy="5" r="1.5" fill="currentColor"/>
        <circle cx="16" cy="27" r="1.5" fill="currentColor"/>
        <line x1="16" y1="13" x2="8" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="16" y1="13" x2="24" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="16" y1="19" x2="8" y2="24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="16" y1="19" x2="24" y2="24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="16" y1="13" x2="16" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="16" y1="19" x2="16" y2="27" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg></div>
      <div class="brand"><h1>OmniRoute</h1><span id="sidebar-ver">v</span></div>
    </div>
    <nav id="sidebar-nav"></nav>
  </aside>
  <div id="main">
    <header id="topbar">
      <button id="sidebar-toggle" class="mini"><span class="material-symbols-outlined">menu</span></button>
      <span id="paged-sub" class="muted small">OmniRoute gateway</span>
      <span class="spacer"></span>
      <span id="health-dot" class="dot"></span><span id="health-text" class="muted small">checking…</span>
      <div id="lang-selector" style="display:none">
        <span id="lang-flag">🇺🇸</span> <b id="lang-label">English</b>
      </div>
      <button id="logout" class="mini hidden"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">logout</span> log out</button>
    </header>
    <div id="default-pw-banner">⚠ Default admin password <b>CHANGEME</b> is active —
      <input type="password" id="new-pw" placeholder="new password (min 8)" style="width:190px;margin:0 8px">
      <button id="pw-change" class="mini">change now</button>
      <span id="pw-msg"></span>
    </div>
    <main id="page"></main>
    <footer>OmniRoute · <a href="https://github.com/diegosouzapw/OmniRoute" target="_blank">upstream project</a> · PWA</footer>
  </div>
</div>
<div id="login-screen" style="display:none">
  <div class="login-card">
    <h2>OmniRoute</h2>
    <p class="muted small">dashboard login</p>
    <input type="password" id="login-password" placeholder="admin password" autocomplete="current-password">
    <button class="save" id="login-btn">Log in</button>
    <p id="login-error" class="s-err"></p>
  </div>
</div>
<div id="modal" style="display:none"><div id="modal-card" class="card"></div></div>
<div id="toast"></div>
<script src="/dashboard/app.js"></script>
</body>
</html>
