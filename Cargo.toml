[package]
name = "omniroute-rust"
version = "1.0.0"
edition = "2021"
description = "OmniRoute AI gateway rewritten in Rust: OpenAI-compatible endpoint, multi-provider routing, quota-aware fallback, SSE streaming"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
base64 = "0.22"
once_cell = "1"
fancy-regex = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = false
strip = true

[[bin]]
name = "omniroute"
path = "src/main.rs"
